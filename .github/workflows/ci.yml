name: VoxPlan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Explicit least-privilege workflow permissions.
# Default to read-only access to prevent unauthorized write or token leakage.
permissions:
  contents: read

# Cancel in-progress runs for pull requests to conserve compute and avoid stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run code linter
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Run frontend test suite
        run: npm test

      - name: Verify PWA and production build artifacts
        run: |
          test -s dist/index.html || (echo "Missing or empty dist/index.html" && exit 1)
          test -s dist/sw.js || (echo "Missing or empty dist/sw.js" && exit 1)
          test -s dist/manifest.webmanifest || (echo "Missing or empty dist/manifest.webmanifest" && exit 1)
          test -s dist/favicon.svg || (echo "Missing or empty dist/favicon.svg" && exit 1)
          test -s dist/pwa-192x192.png || (echo "Missing or empty dist/pwa-192x192.png" && exit 1)
          test -s dist/pwa-512x512.png || (echo "Missing or empty dist/pwa-512x512.png" && exit 1)
          test -s dist/maskable-icon-512x512.png || (echo "Missing or empty dist/maskable-icon-512x512.png" && exit 1)
          echo "All required PWA and production build artifacts verified."

  backend:
    name: Backend Quality & Model Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check dependency consistency
        run: pip check

      - name: Run backend test suite
        env:
          PYTHONPATH: .
        run: python -m pytest backend/tests/

      - name: Verify tests did not dirty model artifacts
        run: |
          git status --porcelain backend/models
          test -z "$(git status --porcelain backend/models)" || (echo "Error: Backend tests modified committed model artifacts" && exit 1)

  security:
    name: Security, Dependencies & Secrets Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev

      - name: Set up Python 3.12 for vulnerability check
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Audit Python backend dependencies with pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Run dedicated secret and credential scanner
        run: node scripts/secretScanner.mjs

      - name: Verify formatting and whitespace hygiene
        run: git diff --check

  docker-runtime:
    name: Docker Container Build & Runtime Smoke Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend, backend, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build production Docker image
        run: docker build -t voxplan:ci-smoke .

      - name: Start isolated container instance
        run: docker run -d --name voxplan-ci-smoke-container -p 8000:8000 voxplan:ci-smoke

      - name: Wait for container healthcheck to transition to healthy
        run: |
          echo "Awaiting container health status transition to 'healthy'..."
          HEALTHY=false
          FINAL_STATUS="unknown"
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' voxplan-ci-smoke-container 2>/dev/null || echo "unknown")
            FINAL_STATUS="$STATUS"
            echo "Health poll attempt $i/30: status is '$STATUS'"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            elif [ "$STATUS" = "unhealthy" ]; then
              echo "Container healthcheck explicitly reported 'unhealthy'"
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Container health status failed to reach 'healthy'. Final status: '$FINAL_STATUS'"
            exit 1
          fi
          echo "Container is verified healthy."

      - name: Verify application /health endpoint contract
        run: |
          echo "Querying http://127.0.0.1:8000/health from host..."
          RESPONSE=$(curl -sS -f --max-time 10 http://127.0.0.1:8000/health)
          echo "Received response: $RESPONSE"

          # Validate schema and values: {"status": "ok", "service": "voxplan-ml"}
          python3 -c "
          import json, sys
          payload = '''$RESPONSE'''
          data = json.loads(payload)
          assert data.get('status') == 'ok', f'Unexpected status: {data.get(\"status\")}'
          assert data.get('service') == 'voxplan-ml', f'Unexpected service: {data.get(\"service\")}'
          print('Successfully verified HealthResponse contract: status=ok, service=voxplan-ml')
          "

      - name: Verify static SPA /app serving
        run: |
          echo "Querying http://127.0.0.1:8000/app from host..."
          APP_HTML=$(curl -sS -f --max-time 10 http://127.0.0.1:8000/app)
          echo "$APP_HTML" | grep -q "VoxPlan" || (echo "ERROR: /app did not return VoxPlan application HTML" && exit 1)
          echo "SPA /app route successfully verified."

      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          echo "=== Docker Container Inspect ==="
          docker inspect voxplan-ci-smoke-container || true
          echo "=== Docker Container Logs ==="
          docker logs --tail 200 voxplan-ci-smoke-container || true

      - name: Cleanup test container and image
        if: always()
        run: |
          echo "Cleaning up test container..."
          docker rm -f voxplan-ci-smoke-container || true
          docker rmi voxplan:ci-smoke || true
